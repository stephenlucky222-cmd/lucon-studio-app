# Builds the two apps, Lucon Studio and Lucon Events, for Mac (Apple chip and Intel) and Windows on GitHub's
# computers, tests them, and when the version in package.json is new, publishes the downloads on the Releases page.
name: Build Lucon Studio and Lucon Events

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  WHISPER_REF: v1.9.4
  SPEECH: "Now faith is the substance of things hoped for, the evidence of things not seen."

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "release=false" >> $GITHUB_OUTPUT; else echo "release=true" >> $GITHUB_OUTPUT; fi
          echo "::notice::Version $V"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-apple
            os: macos-15
            goos: darwin
            goarch: arm64
            cmake: -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
            builder: --mac --arm64
            artifact: Mac-Apple.${ext}
          - name: mac-intel
            os: macos-15-intel
            goos: darwin
            goarch: amd64
            cmake: -DGGML_METAL=OFF -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
            builder: --mac --x64
            artifact: Mac-Intel.${ext}
          - name: windows
            os: windows-2022
            goos: windows
            goarch: amd64
            cmake: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_OPENMP=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
            compat: -DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_OPENMP=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
            builder: --win --x64
            artifact: Windows-Setup.${ext}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # ---------- Lucon Link ----------
      - uses: actions/setup-go@v5
        with:
          go-version-file: link/go.mod
          cache: false
      - name: Build Lucon Link
        run: |
          EXT=""; [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          mkdir -p res/link
          cd link && CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w" -o ../res/link/lucon-link$EXT .
          ls -la ../res/link

      - name: FFmpeg for streaming and recording (so nothing else needs installing)
        continue-on-error: true
        run: |
          cd res/link
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -fsSL --retry 3 -o ff.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
            unzip -q ff.zip && cp ffmpeg-*/bin/ffmpeg.exe . && cp ffmpeg-*/LICENSE.txt FFMPEG-LICENSE.txt && rm -rf ff.zip ffmpeg-*/
          else
            A=$([ "${{ matrix.goarch }}" = "arm64" ] && echo arm64 || echo amd64)
            curl -fsSL --retry 3 -o ff.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$A/release/ffmpeg.zip"
            unzip -q -o ff.zip && rm -f ff.zip && chmod +x ffmpeg
            echo "FFmpeg (https://ffmpeg.org) is free software under the GNU GPL. Source code: https://ffmpeg.org/download.html" > FFMPEG-LICENSE.txt
          fi
          echo "::notice::FFmpeg: $(./ffmpeg -hide_banner -version | head -1)"
          ls -la

      # ---------- Whisper (offline captions) ----------
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_REF }}
          path: wcpp
      - name: Build Whisper
        run: |
          cd wcpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_SERVER=ON -DWHISPER_SDL2=OFF -DWHISPER_CURL=OFF ${{ matrix.cmake }}
          cmake --build build --config Release --target whisper-server -j 4
          mkdir -p ../res/whisper/models
          if [ "${{ matrix.goos }}" = "windows" ]; then cp build/bin/Release/whisper-server.exe ../res/whisper/; else cp build/bin/whisper-server ../res/whisper/; fi
          if [ -n "${{ matrix.compat }}" ]; then
            cmake -B build2 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_SERVER=ON -DWHISPER_SDL2=OFF -DWHISPER_CURL=OFF ${{ matrix.compat }}
            cmake --build build2 --config Release --target whisper-server -j 4
            cp build2/bin/Release/whisper-server.exe ../res/whisper/whisper-server-compat.exe
          fi
          ls -la ../res/whisper
      - name: Whisper models (cached)
        uses: actions/cache@v4
        with:
          path: models
          key: whisper-models-base-small-q5_1-v1
      - name: Download models
        run: |
          mkdir -p models
          for m in ggml-base-q5_1.bin ggml-small-q5_1.bin; do
            [ -s models/$m ] || curl -fsSL --retry 3 -o models/$m "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$m"
          done
          ls -la models
          cp models/*.bin res/whisper/models/
          cp wcpp/LICENSE res/whisper/LICENSE-whisper.txt

      # ---------- real test of offline captions ----------
      - name: Make a spoken sentence (Mac)
        if: runner.os == 'macOS'
        run: |
          say -o "$RUNNER_TEMP/speech.aiff" "$SPEECH"
          afconvert -f WAVE -d LEI16@16000 -c 1 "$RUNNER_TEMP/speech.aiff" "$RUNNER_TEMP/speech.wav"
      - name: Make a spoken sentence (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $f = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\speech.wav", $f)
          $s.Speak($env:SPEECH)
          $s.Dispose()
      - name: Test offline captions
        run: |
          EXT=""; [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          python3 tests/whisper_test.py "res/link/lucon-link$EXT" "res/whisper" "$RUNNER_TEMP/speech.wav" || python tests/whisper_test.py "res/link/lucon-link$EXT" "res/whisper" "$RUNNER_TEMP/speech.wav"

      # ---------- the app ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build Lucon Studio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ARTIFACT: ${{ matrix.artifact }}
        run: node scripts/flavour.js studio && npx electron-builder ${{ matrix.builder }} --publish never --config dist-config.json
      - name: Test Lucon Studio (opens the website inside the app)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then APP="dist/win-unpacked/Lucon Studio.exe"; else APP="$(find dist -maxdepth 2 -name 'Lucon Studio.app' | head -1)/Contents/MacOS/Lucon Studio"; fi
          echo "App: $APP"
          LUCON_SMOKE="$RUNNER_TEMP/smoke-studio.json" LUCON_SMOKE_PCM="$RUNNER_TEMP/speech.pcm" "$APP" || true
          node -e "const fs=require('fs');let r={ok:false,missing:true};try{r=JSON.parse(fs.readFileSync(process.argv[1],'utf8'))}catch{} const m=(r.ok?'LUCON STUDIO TEST PASSED':'LUCON STUDIO TEST FAILED')+'\n'+JSON.stringify(r,null,1); console.log('::'+(r.ok?'notice':'error')+'::'+m.replace(/%/g,'%25').replace(/\n/g,'%0A')); process.exit(r.ok?0:1)" "$RUNNER_TEMP/smoke-studio.json"
      - name: Build Lucon Events
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ARTIFACT: ${{ matrix.artifact }}
        run: node scripts/flavour.js events && npx electron-builder ${{ matrix.builder }} --publish never --config dist-config.json
      - name: Test Lucon Events (opens the website inside the app)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then APP="dist-events/win-unpacked/Lucon Events.exe"; else APP="$(find dist-events -maxdepth 2 -name 'Lucon Events.app' | head -1)/Contents/MacOS/Lucon Events"; fi
          echo "App: $APP"
          LUCON_SMOKE="$RUNNER_TEMP/smoke-events.json" LUCON_SMOKE_PCM="$RUNNER_TEMP/speech.pcm" "$APP" || true
          node -e "const fs=require('fs');let r={ok:false,missing:true};try{r=JSON.parse(fs.readFileSync(process.argv[1],'utf8'))}catch{} const m=(r.ok?'LUCON EVENTS TEST PASSED':'LUCON EVENTS TEST FAILED')+'\n'+JSON.stringify(r,null,1); console.log('::'+(r.ok?'notice':'error')+'::'+m.replace(/%/g,'%25').replace(/\n/g,'%0A')); process.exit(r.ok?0:1)" "$RUNNER_TEMP/smoke-events.json"
      - name: Files
        run: ls -la dist dist-events
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
            dist-events/*.dmg
            dist-events/*.exe
            dist-events/*.blockmap
            dist-events/events*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Put all downloads in one folder
        run: |
          mkdir -p rel
          find out -type f -exec cp -f {} rel/ \;
          ls -la rel
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lucon Events and Lucon Studio ${{ needs.version.outputs.version }}
          body: |
            Two apps. Download the one you need, for your computer.

            Lucon Events: registration, check-in, badges, reports, and Lucon Studio inside.
            • Mac with an Apple chip (M1, M2, M3, M4…): Lucon-Events-Mac-Apple.dmg
            • Mac with an Intel processor: Lucon-Events-Mac-Intel.dmg
            • Windows 10 or 11: Lucon-Events-Windows-Setup.exe

            Lucon Studio: live production only. Opens straight to the Studio.
            • Mac with an Apple chip: Lucon-Studio-Mac-Apple.dmg
            • Mac with an Intel processor: Lucon-Studio-Mac-Intel.dmg
            • Windows 10 or 11: Lucon-Studio-Windows-Setup.exe

            Both have Lucon Link and offline captions built in.
          files: rel/*
          fail_on_unmatched_files: true
