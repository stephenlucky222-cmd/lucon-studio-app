<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Share a screen or window</title><style>
body{margin:0;background:#0b0f17;color:#e5e7eb;font:14px -apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100vh}
h1{font-size:16px;margin:16px 18px 4px}p{margin:0 18px 10px;color:#94a3b8;font-size:12.5px}
.tabs{display:flex;gap:8px;margin:0 18px 10px}.tabs button{background:none;border:1px solid #2a3344;color:#cbd5e1;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}.tabs button.on{background:#2563eb;border-color:#2563eb;color:#fff}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:4px 18px 12px}
.it{background:#111621;border:2px solid #1f2937;border-radius:10px;padding:8px;cursor:pointer}.it.on{border-color:#3b82f6}.it img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:6px;display:block}.it b{display:block;margin-top:6px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid #1f2937}.bar label{flex:1;color:#cbd5e1;font-size:13px}
.bar button{height:36px;border-radius:9px;border:1px solid #2a3344;background:#141a26;color:#e5e7eb;font-weight:800;padding:0 16px;cursor:pointer}.bar .go{background:#2563eb;border-color:#2563eb;color:#fff}.bar .go:disabled{opacity:.5}
</style></head><body>
<h1>Share a screen or window</h1><p>Choose what Lucon Studio should show (slides, a video call, a browser…).</p>
<div class="tabs"><button data-t="screen" class="on">Whole screen</button><button data-t="window">One window</button></div>
<div class="grid" id="g"></div>
<div class="bar"><label id="au"><input type="checkbox" id="snd"> Also take the computer's sound</label><button id="cancel">Cancel</button><button class="go" id="ok" disabled>Share</button></div>
<script>
let L=[], tab='screen', sel=null;
function draw(){ const g=document.getElementById('g'); g.innerHTML=''; L.filter(s=>tab==='screen'?s.screen:!s.screen).forEach(s=>{ const d=document.createElement('div'); d.className='it'+(s.id===sel?' on':''); const i=document.createElement('img'); i.src=s.img; const b=document.createElement('b'); b.textContent=s.name; d.append(i,b); d.onclick=()=>{ sel=s.id; draw(); document.getElementById('ok').disabled=false; }; d.ondblclick=()=>window.picker.done(s.id,document.getElementById('snd').checked); g.appendChild(d); }); }
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b)); draw(); });
document.getElementById('cancel').onclick=()=>window.picker.done(null);
document.getElementById('ok').onclick=()=>window.picker.done(sel,document.getElementById('snd').checked);
window.picker.onList((list,win)=>{ L=list; if(!win) document.getElementById('au').style.visibility='hidden'; const f=L.find(s=>s.screen); if(f) sel=f.id; document.getElementById('ok').disabled=!sel; draw(); });
</script></body></html>
